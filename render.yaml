services:
  - type: web
    name: text-summarizer
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # This model is downloaded from Hugging Face because the local model
      # directory is intentionally excluded from the Git repository.
      - key: MODEL_PATH
        value: Karthiktelukutla2004/text-summarizer
